
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 4 - Teste da API</title>
</head>
<body>
    <h1>Lista de usuários</h1>

    <pre id="resultado">Carregando usuários...</pre>

    <script>
        fetch('http://localhost:3000/usuarios')
            .then(resposta => {
                if (!resposta.ok) {
                    throw new Error('Erro HTTP: ' + resposta.status);
                }

                return resposta.json();
            })
            .then(dados => {
                document.getElementById('resultado').textContent =
                    JSON.stringify(dados, null, 2);

                console.log(dados);
            })
            .catch(erro => {
                document.getElementById('resultado').textContent =
                    'Erro: ' + erro.message;

                console.error(erro);
            });
    </script>
</body>
</html>
